name: Mac
on:
  push:
  workflow_dispatch:
concurrency:                # a newer push replaces a run still waiting
  group: mac-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash            # -eo pipefail, so a failing build fails the step
jobs:
  app:
    runs-on: macos-15      # Apple silicon
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && uname -m && sw_vers
      - name: Build
        working-directory: mac
        run: |
          swift build > build.log 2>&1 || { grep -E -A4 "error:" build.log | head -200; exit 1; }
          grep -E "warning:" build.log | sort -u | head -40 || true
      - name: Test
        working-directory: mac
        run: |
          swift test > test.log 2>&1 || { grep -E -A4 "error:|failed|Fatal|crash" test.log | head -250; exit 1; }
          grep -E "Executed [0-9]+ tests" test.log | tail -3
  composer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"     # the Mac's own python3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python and JavaScript tests
        run: python3 --version && python3 -m unittest discover -s tests -t . 2>&1 | tail -30
